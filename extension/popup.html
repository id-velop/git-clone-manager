<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Git Clone Manager</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup">
    <div class="header">
      <div class="logo">
        <img class="brand-icon brand-icon-24" src="icons/clone-manager.svg" alt="">
      </div>
      <h1>Git Clone Manager</h1>
    </div>

    <div id="server-status" class="status-bar">
      <div class="status-dot" id="status-dot"></div>
      <span id="status-text">Ready</span>
    </div>

    <!-- Payment status bar -->
    <div id="payment-status" class="payment-bar">
      <div class="payment-info">
        <span id="payment-icon">🔒</span>
        <span id="payment-text">Checking access...</span>
      </div>
      <button id="payment-btn" class="payment-btn">Get Pro</button>
    </div>
    <p id="payment-message" class="payment-message" role="status" aria-live="polite"></p>

    <div id="clone-section" class="section">
      <label class="label">Clone URL</label>
      <div class="input-group">
        <input type="text" id="clone-url" placeholder="https://github.com/user/repo.git" />
      </div>

      <button id="clone-btn" class="clone-btn">
        <img class="brand-icon brand-icon-18" src="icons/clone-manager.svg" alt="">
        Open Clone Page
      </button>
    </div>

    <div class="footer">
      <a href="#" id="options-link">How it works</a>
      <span class="version">v1.1.7</span>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
