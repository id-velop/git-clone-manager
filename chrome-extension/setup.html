<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Set up your Mac | Clone to Folder</title>
  <link rel="stylesheet" href="options.css">
  <link rel="stylesheet" href="setup.css">
</head>
<body>
  <main class="settings-shell">
    <header class="page-header"><div class="brand"><img src="icons/icon48.png" width="40" height="40" alt="">Clone to Folder</div><span class="version">macOS setup</span></header>
    <div class="title-block"><h1>Install companion</h1><p>Run this in Terminal, then reconnect from the extension.</p></div>
    <pre tabindex="0"><code id="install-command">Loading install command…</code></pre>
    <button id="copy-command" type="button" class="download-link" disabled>Copy command</button>
    <p id="copy-status" role="status"></p>
    <p class="hint">macOS · Installs Node.js and Git if needed. May ask for your Mac password.</p>
  </main>
  <script src="setup.js"></script>
</body>
</html>
