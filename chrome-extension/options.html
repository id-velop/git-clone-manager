<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Settings | Quick Clone</title>
  <link rel="stylesheet" href="options.css">
</head>
<body>
  <main class="settings-shell">
    <header class="page-header">
      <a class="brand" href="https://github.com/id-velop/quick-clone" target="_blank" rel="noreferrer">
        <span class="brand-mark" aria-hidden="true"><img src="icons/icon.svg" width="42" height="42" alt=""></span>
        <span>Quick Clone</span>
      </a>
      <span class="version">Version 1.1.5</span>
    </header>

    <div class="title-block">
      <h1>Settings</h1>
    </div>

    <form id="settings-form">
      <section class="settings-card" aria-labelledby="destination-heading">
        <div class="card-index" aria-hidden="true">01</div>
        <div class="card-content">
          <div class="card-heading">
            <h2 id="destination-heading">Destination</h2>
          </div>
          <label for="clone-dir">Default clone directory</label>
          <div class="path-field">

            <input type="text" id="clone-dir" placeholder="~/Projects" spellcheck="false" aria-describedby="clone-dir-hint">
          </div>
          <p class="hint" id="clone-dir-hint">You can still choose a different folder from Quick Clone.</p>
        </div>
      </section>

      <section class="settings-card" aria-labelledby="terminal-heading">
        <div class="card-index" aria-hidden="true">02</div>
        <div class="card-content">
          <div class="card-heading">
            <h2 id="terminal-heading">Terminal</h2>
          </div>
          <label for="terminal-app">Preferred application</label>
          <select id="terminal-app">
            <option value="Terminal">macOS Terminal</option>
            <option value="iTerm">iTerm2</option>
            <option value="Warp">Warp</option>
          </select>

          <label class="terminal-toggle" for="open-terminal">
            <span><strong>Open after clone</strong></span>
            <span class="switch"><input type="checkbox" id="open-terminal"><span class="switch-track" aria-hidden="true"></span></span>
          </label>
        </div>
      </section>



      <div class="form-actions">
        <p id="status" class="status" role="status" aria-live="polite"></p>
        <button class="save-btn" id="save-btn" type="submit"><span>Save changes</span><svg viewBox="0 0 20 20" width="18" height="18" aria-hidden="true"><path d="m7 4 6 6-6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      </div>
    </form>
    <p class="repository-link"><a href="https://github.com/id-velop/quick-clone" target="_blank" rel="noreferrer">github.com/id-velop/quick-clone</a></p>
    <p class="icon-credit">Icon created by Lagot Design from the Noun Project</p>
  </main>
  <script src="i18n.js"></script>
  <script src="options.js"></script>
</body>
</html>
