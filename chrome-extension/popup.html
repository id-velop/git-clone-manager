<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quick Clone</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main class="popup">
    <header class="header">
      <div class="brand-mark" aria-hidden="true"><img src="icons/icon.svg" width="42" height="42" alt="">
      </div>
      <div class="brand-copy">
        <h1>Quick Clone</h1>
      </div>
      <div id="server-status" class="status-chip" aria-live="polite">
        <span class="status-dot" id="status-dot" aria-hidden="true"></span>
        <span id="status-text">Checking</span>
      </div>
      <div class="header-actions">
        <div class="language-segment" role="group" aria-label="Language">
          <button type="button" data-language-option="zh" aria-pressed="false">中</button>
          <button type="button" data-language-option="en" aria-pressed="true">En</button>
        </div>
        <button type="button" id="options-link" class="settings-icon" aria-label="Settings">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 3-.5 2-2 1L4.5 5.5 2 10l1.5 1.5v1L2 14l2.5 4.5 2-.5 2 1 .5 2h6l.5-2 2-1 2 .5L22 14l-1.5-1.5v-1L22 10l-2.5-4.5-2 .5-2-1-.5-2z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
      </div>
    </header>



    <div id="home-view">
    <p id="language-status" role="status" aria-live="polite"></p>
    <section class="clone-workspace" aria-label="Quick Clone">

      <div class="protocol-tabs" role="tablist" aria-label="Clone protocol">
        <button id="protocol-tab-https" class="protocol-tab active" type="button" role="tab" aria-selected="true" aria-controls="https-panel" data-protocol-tab="https" disabled>HTTPS</button>
        <button id="protocol-tab-ssh" class="protocol-tab" type="button" role="tab" aria-selected="false" aria-controls="ssh-panel" data-protocol-tab="ssh" disabled tabindex="-1">SSH</button>
      </div>

      <p id="protocol-save-status" role="status" aria-live="polite"></p>
      <div id="clone-section" hidden>
      <div id="https-panel" class="clone-method" role="tabpanel" aria-labelledby="protocol-tab-https" data-protocol-panel="https">
        <input type="text" id="clone-url" aria-label="Repository address (HTTPS)" spellcheck="false" placeholder="https://host/team/repo.git">
        <button id="clone-btn" class="clone-btn" type="button"><span>Quick Clone</span><svg viewBox="0 0 20 20" width="18" height="18" aria-hidden="true"><path d="m7 4 6 6-6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      </div>

      <div id="ssh-panel" class="clone-method" role="tabpanel" aria-labelledby="protocol-tab-ssh" data-protocol-panel="ssh" hidden>
        <input type="text" id="clone-ssh-url" aria-label="Repository address (SSH)" spellcheck="false" placeholder="git@host:team/repo.git">
        <button id="clone-ssh-btn" class="clone-btn" type="button"><span>Quick Clone</span><svg viewBox="0 0 20 20" width="18" height="18" aria-hidden="true"><path d="m7 4 6 6-6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      </div>

      </div>
    </section>



    <section id="no-server" class="connection-card" hidden>
      <details id="inline-setup" open>
        <summary>Set up local companion</summary>
        <p id="setup-instruction" class="connection-copy">Run this in Terminal, then reconnect.</p>
        <pre tabindex="0"><code id="install-command">Loading install command…</code></pre>
        <button id="copy-command" class="install-link" type="button" disabled>Copy command</button>
        <p id="copy-status" role="status"></p>
        <p id="setup-note" class="setup-note">macOS · Installs Node.js and Git if needed. May ask for your Mac password.</p>
      </details>
      <button id="start-server-btn" class="connect-btn" type="button">Reconnect</button>
      <p id="start-error" class="start-error" role="alert" hidden></p>
    </section>

    <section id="starting-server" class="loading-card" aria-live="polite" hidden>
      <span class="spinner" aria-hidden="true"></span>
      <div><h2>Connecting…</h2></div>
    </section>




    </div>
    <section id="settings-view" hidden aria-labelledby="settings-title">
      <div class="settings-heading">
        <button id="settings-back" type="button" class="settings-link">← Back</button>
        <h2 id="settings-title">Settings</h2>
      </div>
      <form id="popup-settings-form" class="clone-workspace settings-form">
        <label for="settings-directory">Default folder</label>
        <input id="settings-directory" type="text" placeholder="~/Projects" spellcheck="false" disabled>
        <label for="settings-terminal">Terminal app</label>
        <select id="settings-terminal" disabled>
          <option value="Terminal">macOS Terminal</option>
          <option value="iTerm">iTerm2</option>
          <option value="Warp">Warp</option>
        </select>
        <label class="terminal-option" for="settings-open-terminal">
          <span>Open Terminal after clone</span>
          <span class="switch"><input id="settings-open-terminal" type="checkbox" disabled><span class="switch-track" aria-hidden="true"></span></span>
        </label>
        <button id="settings-save" type="submit" class="clone-btn" disabled>Save changes</button>
        <p id="settings-status" role="status" aria-live="polite"></p>
      </form>
      <p class="settings-version version">Version 1.1.5</p>
      <p class="icon-credit">Icon created by Lagot Design from the Noun Project</p>
    </section>
  </main>
  <script src="i18n.js"></script>
  <script src="setup.js"></script>
  <script src="popup.js"></script>
</body>
</html>
