<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Clone Manager</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup">
    <div class="header">
      <div class="logo">
        <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true">
          <path fill="#8b5cf6" d="M10.5 3H13.5V11L17 7.5L19 9.5L12 16.5L5 9.5L7 7.5L10.5 11ZM4 19H20V22H4Z"/>
        </svg>
      </div>
      <h1>Clone Manager</h1>
    </div>

    <div id="server-status" class="status-bar">
      <div class="status-dot" id="status-dot"></div>
      <span id="status-text">Checking server...</span>
    </div>

    <div class="section protocol-preference">
      <label for="default-clone-protocol" class="label">Instant Clone method</label>
      <select id="default-clone-protocol">
        <option value="">Ask every time</option>
        <option value="https">Always HTTPS</option>
        <option value="ssh">Always SSH</option>
      </select>
      <p id="protocol-save-status" role="status" aria-live="polite"></p>
    </div>

    <div id="clone-section" class="section" style="display:none;">
      <div class="clone-methods">
        <div class="clone-method">
          <label class="label" for="clone-url">HTTPS</label>
          <div class="input-group"><input type="text" id="clone-url" placeholder="https://host/team/repo.git" /></div>
          <button id="clone-btn" class="clone-btn" type="button">Clone HTTPS</button>
        </div>
        <div class="clone-method">
          <label class="label" for="clone-ssh-url">SSH</label>
          <div class="input-group"><input type="text" id="clone-ssh-url" placeholder="git@host:team/repo.git" /></div>
          <button id="clone-ssh-btn" class="clone-btn" type="button">Clone SSH</button>
        </div>
      </div>

      <div class="toggle-row">
        <span>Open in Terminal</span>
        <label class="toggle">
          <input type="checkbox" id="open-terminal" />
          <span class="toggle-slider"></span>
        </label>
      </div>

    </div>

    <div id="no-server" class="section" style="display:none;">
      <div class="error-box setup-box">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
          <path fill="#8b5cf6" d="M1 21h22L12 2 1 21zm12-3h-2v-2h2v2zm0-4h-2v-4h2v4z"/>
        </svg>
        <div>
          <strong>Connect your local service</strong>
          <p>Install and register the Clone Manager companion, then retry the connection.</p>
          <button id="start-server-btn" class="start-server-btn">
            <svg viewBox="0 0 24 24" width="16" height="16">
              <path fill="currentColor" d="M8 5v14l11-7z"/>
            </svg>
            Connect / Retry
          </button>
          <p id="start-error" class="start-error" style="display:none;"></p>
        </div>
      </div>
    </div>

    <div id="starting-server" class="section" style="display:none;">
      <div class="loading-box">
        <div class="spinner"></div>
        <p>Starting server...</p>
        <p class="loading-sub">This may take a few seconds</p>
      </div>
    </div>

    <div class="footer">
      <a href="#" id="options-link">Settings</a>
      <span class="version">v1.1.4</span>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
